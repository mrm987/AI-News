<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 뉴스 큐레이터</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0a0b;
      --bg-secondary: #121214;
      --bg-card: #1a1a1d;
      --text-primary: #e8e8e8;
      --text-secondary: #888;
      --accent: #00ff88;
      --accent-dim: #00ff8833;
      --border: #2a2a2d;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.7;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    header {
      margin-bottom: 40px;
      padding-bottom: 30px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-family: 'Space Mono', monospace;
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    h1::before {
      content: '>';
      color: var(--accent);
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .meta-info {
      display: flex;
      gap: 20px;
      margin-top: 16px;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .meta-info span {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .news-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .news-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      transition: border-color 0.2s;
    }

    .news-item:hover {
      border-color: var(--accent);
    }

    .news-item h2 {
      font-size: 1.15rem;
      font-weight: 500;
      margin-bottom: 12px;
      color: var(--accent);
    }

    .news-item .summary {
      margin-bottom: 12px;
      color: var(--text-primary);
    }

    .news-item .importance {
      font-size: 0.9rem;
      color: var(--text-secondary);
      padding-left: 12px;
      border-left: 2px solid var(--accent-dim);
      margin-bottom: 12px;
    }

    .news-item .source {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .news-item a {
      color: var(--accent);
      text-decoration: none;
    }

    .news-item a:hover {
      text-decoration: underline;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .loading::before {
      content: '📡';
      display: block;
      font-size: 3rem;
      margin-bottom: 16px;
      animation: pulse 1.5s infinite;
    }

    .error {
      text-align: center;
      padding: 60px 20px;
      color: #ff6b6b;
    }

    .raw-content {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      white-space: pre-wrap;
      font-size: 0.95rem;
      line-height: 1.8;
    }

    .raw-content h3 {
      color: var(--accent);
      margin: 20px 0 10px 0;
    }

    .raw-content h3:first-child {
      margin-top: 0;
    }

    .raw-content strong {
      color: var(--accent);
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.5rem;
      }
      
      .container {
        padding: 24px 16px;
      }
      
      .news-item {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>AI NEWS CURATOR</h1>
      <p class="subtitle">Gemini API 기반 AI 뉴스 자동 큐레이션</p>
      <div class="meta-info">
        <span><span class="status-dot"></span> 자동 갱신 (1일 2회)</span>
        <span id="lastUpdate">마지막 업데이트: 로딩중...</span>
      </div>
    </header>

    <div id="content">
      <div class="loading">뉴스를 불러오는 중...</div>
    </div>
  </div>

  <script>
    async function loadNews() {
      const contentEl = document.getElementById('content');
      const lastUpdateEl = document.getElementById('lastUpdate');

      try {
        const response = await fetch('./data/news.json');
        if (!response.ok) throw new Error('Failed to load news data');
        
        const data = await response.json();
        
        // 마지막 업데이트 시간 표시
        if (data.updatedAt) {
          const date = new Date(data.updatedAt);
          lastUpdateEl.textContent = `마지막 업데이트: ${date.toLocaleString('ko-KR')}`;
        }

        // JSON 파싱 실패한 경우 원본 텍스트 표시
        if (data.parseError && data.rawContent) {
          contentEl.innerHTML = `<div class="raw-content">${formatRawContent(data.rawContent)}</div>`;
          return;
        }

        // 뉴스 목록 표시
        if (data.news && data.news.length > 0) {
          contentEl.innerHTML = `
            <div class="news-list">
              ${data.news.map(item => `
                <article class="news-item">
                  <h2>${escapeHtml(item.title)}</h2>
                  <p class="summary">${escapeHtml(item.summary)}</p>
                  ${item.importance ? `<p class="importance">${escapeHtml(item.importance)}</p>` : ''}
                  <p class="source">
                    ${item.source ? `출처: ${escapeHtml(item.source)}` : ''}
                    ${item.url ? ` | <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener">원문 보기</a>` : ''}
                  </p>
                </article>
              `).join('')}
            </div>
          `;
        } else {
          contentEl.innerHTML = '<div class="loading">표시할 뉴스가 없습니다.</div>';
        }

      } catch (error) {
        contentEl.innerHTML = `<div class="error">뉴스를 불러오지 못했습니다: ${error.message}</div>`;
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatRawContent(text) {
      return text
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm, '<h3>$1</h3>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    }

    loadNews();
  </script>
</body>
</html>
